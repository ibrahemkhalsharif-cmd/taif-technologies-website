<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131B2E" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <title>Taif Technologies</title>

    <!--
      Link previews (WhatsApp, Facebook, LinkedIn, X). Their crawlers do not run JavaScript,
      so these tags live here in the static HTML. %SITE_URL% is filled in at build time (vite.config.ts).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taif Technologies" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta
      property="og:title"
      content="NEX ERP من Taif Technologies — من عرض السعر إلى الصيانة، في نظام واحد"
    />
    <meta
      property="og:description"
      content="NEX ERP نظام سحابي عربي لتخطيط موارد المؤسسات: عروض الأسعار والعقود والتركيب والصيانة والبلاغات والفوترة والمحاسبة في مكان واحد. Cloud, Arabic-first ERP from offer to maintenance."
    />
    <meta property="og:locale" content="ar_PS" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="NEX ERP by Taif Technologies — cloud ERP from offer to maintenance"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <script>
      // Set language, direction and theme before first paint so nothing flips or flashes after load.
      (function () {
        var en = /^\/en(\/|$)/.test(location.pathname);
        document.documentElement.lang = en ? 'en' : 'ar';
        document.documentElement.dir = en ? 'ltr' : 'rtl';

        // Theme: the visitor's saved choice, otherwise the system setting (see ThemeProvider).
        var theme = null;
        try {
          theme = localStorage.getItem('taif-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
